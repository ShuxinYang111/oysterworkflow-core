name: Feature Request
description: Suggest an improvement to OysterWorkflow Core.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract Or Privacy Impact
      description: Does this affect output files, prompt inputs, traces, or user data?
    validations:
      required: false
